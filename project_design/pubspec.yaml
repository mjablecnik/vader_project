name: project_design
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  theme_tailor_annotation: 3.1.0
  vader_design: 0.2.0
  flutter_svg: 2.2.0

  cupertino_icons: 1.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter

  storybook_toolkit: 2.0.0-dev.0
  storybook_toolkit_tester: 1.4.0-dev.0

  flutter_lints: 6.0.0
  build_runner: 2.6.0
  theme_tailor: 3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
